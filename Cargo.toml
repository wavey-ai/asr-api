[package]
name = "asr-api"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "cohere-debug"
path = "src/bin/cohere-debug/main.rs"
required-features = ["gpu-backend", "audio-decoder"]

[[bin]]
name = "timestamp-validate"
path = "src/bin/timestamp-validate/main.rs"
required-features = ["cohere-backend", "parakeet-backend", "audio-decoder"]

[[bin]]
name = "ctc-align-debug"
path = "src/bin/ctc-align-debug/main.rs"
required-features = ["cohere-backend", "audio-decoder"]

[features]
default = ["cohere-backend", "audio-decoder"]
gpu-backend = []
cohere-backend = [
    "gpu-backend",
    "dep:mel_spec",
    "dep:ort",
    "dep:rustfft",
    "dep:tokenizers",
]
cohere-mlx = [
    "gpu-backend",
    "dep:rustfft",
]
parakeet-backend = [
    "gpu-backend",
    "dep:asr-onnx",
    "dep:mel_spec",
    "dep:rustfft",
]
audio-decoder = ["dep:av-api", "dep:soundkit", "dep:soundkit-decoder"]

[dependencies]
anyhow = "1.0"
asr-onnx = { path = "../asr-onnx", optional = true }
async-trait = "0.1"
av-api = { git = "https://github.com/wavey-ai/av-api.git", optional = true }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossbeam-channel = "0.5"
dotenvy = "0.15"
futures-util = "0.3"
gen-id = { git = "https://github.com/wavey-ai/gen-id.git" }
gpu-worker = { git = "https://github.com/wavey-ai/gpu-workers.git", package = "gpu-worker", features = ["upload-response"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
http-pack = { git = "https://github.com/wavey-ai/http-pack.git", default-features = false }
mel_spec = { path = "../mel-spec", default-features = false, optional = true }
ndarray = "0.17"
reqwest = { version = "0.12", features = ["rustls-tls", "http2"] }
ort = { git = "https://github.com/pykeio/ort.git", rev = "8724e89ff005ebef4339d7280ff592837404a98d", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "load-dynamic",
    "api-23",
    "tensorrt",
    "cuda",
    "coreml",
], optional = true }
rustfft = { version = "6.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
soundkit = { git = "https://github.com/wavey-ai/soundkit.git", package = "soundkit", optional = true }
soundkit-decoder = { git = "https://github.com/wavey-ai/soundkit.git", package = "soundkit-decoder", optional = true }
tokio = { version = "1.45", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
upload-response = { git = "https://github.com/wavey-ai/web-services.git", package = "upload-response" }
url = "2.5"
web-service = { git = "https://github.com/wavey-ai/web-services.git", package = "web-service" }
