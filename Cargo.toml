[package]
name = "transcriber"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
futures-util = "0.3"
http = "1"
http-pack = { git = "https://github.com/wavey-ai/http-pack.git", default-features = false }
parakeet-rs = "0.3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
soundkit = { git = "https://github.com/wavey-ai/soundkit.git", rev = "95cc81baa455dbaff48e1c8bed25067462b6966c", package = "soundkit" }
soundkit-decoder = { git = "https://github.com/wavey-ai/soundkit.git", rev = "95cc81baa455dbaff48e1c8bed25067462b6966c", package = "soundkit-decoder" }
tokio = { version = "1.45", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
upload-response = { git = "https://github.com/wavey-ai/web-services.git", rev = "df792f953e884137bba33dcb16e20cb42d10c4e6", package = "upload-response" }
web-service = { git = "https://github.com/wavey-ai/web-services.git", rev = "df792f953e884137bba33dcb16e20cb42d10c4e6", package = "web-service" }
