name: Deploy Asr API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-asr-api-main
  cancel-in-progress: true

env:
  ASR_API_CLUSTER_LABEL: wavey
  ASR_API_NAMESPACE: asr-api
  ASR_API_DOMAIN: asr.wavey.ai
  ASR_API_IMAGE: ghcr.io/wavey-ai/asr-api
  ASR_API_MODEL_PVC: asr-api-model
  ASR_API_MODEL_ROOT: /var/lib/asr-api/models
  ASR_API_MODEL_DIR: /var/lib/asr-api/models/parakeet-tdt

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure git auth for private dependencies
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${{ secrets.WAVEY_AI_GH_TOKEN }}@github.com/".insteadOf https://github.com/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate deploy artifacts
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps >/dev/null
          python3 -m py_compile deploy/linode_api.py
          kubectl kustomize deploy/k8s/transcriber >/dev/null

      - name: Detect image changes
        id: changes
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "wait_image=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before=""
          fi

          if [ -n "$before" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            changed_files="$(git diff --name-only "$before" "$GITHUB_SHA")"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            changed_files="$(git diff --name-only HEAD^ HEAD)"
          else
            changed_files="$(git ls-files)"
          fi

          if [ -z "$changed_files" ]; then
            changed_files="$(git show --pretty='' --name-only "$GITHUB_SHA")"
          fi

          wait_image=false
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              .github/workflows/build-image.yml|.dockerignore|docker/*|docker/**|src/*|src/**|Cargo.toml|Cargo.lock)
                wait_image=true
                ;;
            esac
          done <<<"$changed_files"

          echo "wait_image=$wait_image" >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          printf '  %s\n' $changed_files
          echo "wait_image=$wait_image"

      - name: Resolve LKE cluster
        id: cluster
        env:
          LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
        run: |
          set -euo pipefail
          python3 deploy/linode_api.py cluster-id \
            --label "$ASR_API_CLUSTER_LABEL" \
            --github-output "$GITHUB_OUTPUT"

      - name: Fetch cluster kubeconfig
        id: kubeconfig
        env:
          LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
        run: |
          set -euo pipefail
          kubeconfig_path="$RUNNER_TEMP/wavey-kubeconfig.yaml"
          python3 deploy/linode_api.py cluster-kubeconfig \
            --cluster-id "${{ steps.cluster.outputs.cluster_id }}" \
            --output "$kubeconfig_path" \
            --github-output "$GITHUB_OUTPUT"

      - name: Deploy asr-api to LKE
        env:
          KUBECONFIG: ${{ steps.kubeconfig.outputs.kubeconfig }}
          MODEL_TARBALL_URL: ${{ secrets.ASR_API_MODEL_TARBALL_URL }}
        run: |
          set -euo pipefail

          kubectl apply -f deploy/k8s/transcriber/namespace.yaml

          openssl req -x509 -nodes -newkey rsa:2048 -sha256 \
            -keyout "$RUNNER_TEMP/asr-api.key" \
            -out "$RUNNER_TEMP/asr-api.crt" \
            -days 30 \
            -subj "/CN=asr-api" \
            -addext "subjectAltName=DNS:asr-api-ingress,DNS:asr-api-ingress.${ASR_API_NAMESPACE}.svc.cluster.local,DNS:asr-api-ingress-internal,DNS:asr-api-ingress-internal.${ASR_API_NAMESPACE}.svc.cluster.local"

          openssl req -x509 -nodes -newkey rsa:2048 -sha256 \
            -keyout "$RUNNER_TEMP/${ASR_API_DOMAIN}.key" \
            -out "$RUNNER_TEMP/${ASR_API_DOMAIN}.crt" \
            -days 30 \
            -subj "/CN=${ASR_API_DOMAIN}" \
            -addext "subjectAltName=DNS:${ASR_API_DOMAIN}"

          kubectl -n "$ASR_API_NAMESPACE" create secret docker-registry ghcr-wavey-ai \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ github.token }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n "$ASR_API_NAMESPACE" create secret tls asr-api-tls \
            --cert="$RUNNER_TEMP/asr-api.crt" \
            --key="$RUNNER_TEMP/asr-api.key" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n "$ASR_API_NAMESPACE" create secret tls asr-wavey-ai-tls \
            --cert="$RUNNER_TEMP/${ASR_API_DOMAIN}.crt" \
            --key="$RUNNER_TEMP/${ASR_API_DOMAIN}.key" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          wait_for_image() {
            local image="$1"
            local attempts="${2:-60}"
            local delay_seconds="${3:-10}"
            for _ in $(seq 1 "$attempts"); do
              if docker manifest inspect "$image" >/dev/null 2>&1; then
                return 0
              fi
              sleep "$delay_seconds"
            done
            echo "Timed out waiting for image $image" >&2
            return 1
          }

          asr_api_image="${ASR_API_IMAGE}:main"
          if [ "${{ steps.changes.outputs.wait_image }}" = "true" ]; then
            short_sha="${GITHUB_SHA::7}"
            asr_api_image="${ASR_API_IMAGE}:sha-${short_sha}"
            wait_for_image "$asr_api_image"
          fi

          kubectl apply -f deploy/k8s/transcriber/pvc.yaml

          if [ -n "${MODEL_TARBALL_URL}" ]; then
            kubectl -n "$ASR_API_NAMESPACE" delete job asr-api-model-sync --ignore-not-found=true --wait=true || true
            kubectl -n "$ASR_API_NAMESPACE" create secret generic asr-api-model-sync \
              --from-literal=model-url="$MODEL_TARBALL_URL" \
              --dry-run=client -o yaml | kubectl apply -f -

            cat <<'EOF' | kubectl apply -f -
            apiVersion: batch/v1
            kind: Job
            metadata:
              name: asr-api-model-sync
              namespace: asr-api
            spec:
              ttlSecondsAfterFinished: 300
              backoffLimit: 1
              template:
                spec:
                  restartPolicy: Never
                  containers:
                    - name: sync
                      image: alpine:3.20
                      command:
                        - sh
                        - -lc
                        - |
                          set -euo pipefail
                          apk add --no-cache ca-certificates curl >/dev/null
                          archive="/tmp/parakeet-model.tar.gz"
                          scratch_dir="/tmp/parakeet-model"
                          target_dir="/var/lib/asr-api/models/parakeet-tdt"
                          rm -rf "$scratch_dir" "$target_dir"
                          mkdir -p "$scratch_dir" "$target_dir"
                          curl -fsSL "$MODEL_TARBALL_URL" -o "$archive"
                          tar -xzf "$archive" -C "$scratch_dir"
                          source_dir="$scratch_dir"
                          if [ ! -f "$source_dir/encoder.onnx" ] && [ ! -f "$source_dir/encoder.fp16.onnx" ] && [ ! -f "$source_dir/encoder.int8.onnx" ]; then
                            candidate="$(find "$scratch_dir" -mindepth 1 -maxdepth 4 -type f \( -name encoder.onnx -o -name encoder.fp16.onnx -o -name encoder.int8.onnx \) | head -n 1)"
                            [ -n "$candidate" ] || exit 1
                            source_dir="$(dirname "$candidate")"
                          fi
                          copy_first() {
                            dest_dir="$1"
                            shift
                            for name in "$@"; do
                              if [ -f "$source_dir/$name" ]; then
                                cp "$source_dir/$name" "$dest_dir/"
                                if [ -f "$source_dir/$name.data" ]; then
                                  cp "$source_dir/$name.data" "$dest_dir/"
                                fi
                                return 0
                              fi
                            done
                            return 1
                          }

                          copy_first "$target_dir" encoder.fp16.onnx encoder.onnx encoder.int8.onnx
                          copy_first "$target_dir" decoder.fp16.onnx decoder.onnx decoder.int8.onnx
                          copy_first "$target_dir" joint.enc.fp16.onnx joint.enc.onnx joint.enc.int8.onnx
                          copy_first "$target_dir" joint.pred.fp16.onnx joint.pred.onnx joint.pred.int8.onnx
                          copy_first "$target_dir" joint.joint_net.fp16.onnx joint.joint_net.onnx joint.joint_net.int8.onnx
                          copy_first "$target_dir" tokens.txt vocab.txt
                      env:
                        - name: MODEL_TARBALL_URL
                          valueFrom:
                            secretKeyRef:
                              name: asr-api-model-sync
                              key: model-url
                      volumeMounts:
                        - name: model
                          mountPath: /var/lib/asr-api/models
                  volumes:
                    - name: model
                      persistentVolumeClaim:
                        claimName: asr-api-model
            EOF

            kubectl -n "$ASR_API_NAMESPACE" wait --for=condition=complete job/asr-api-model-sync --timeout=20m
            kubectl -n "$ASR_API_NAMESPACE" logs job/asr-api-model-sync
            kubectl -n "$ASR_API_NAMESPACE" delete secret asr-api-model-sync --ignore-not-found=true
          else
            echo "ASR_API_MODEL_TARBALL_URL not set; skipping model sync job"
          fi

          kubectl apply -k deploy/k8s/transcriber
          kubectl -n "$ASR_API_NAMESPACE" set image deployment/asr-api-ingress ingress="$asr_api_image"
          kubectl -n "$ASR_API_NAMESPACE" set image deployment/asr-api-worker worker="$asr_api_image"
          kubectl -n "$ASR_API_NAMESPACE" rollout restart deployment/asr-api-ingress
          kubectl -n "$ASR_API_NAMESPACE" rollout restart deployment/asr-api-worker
          kubectl -n "$ASR_API_NAMESPACE" rollout status deployment/asr-api-ingress --timeout=15m
          kubectl -n "$ASR_API_NAMESPACE" rollout status deployment/asr-api-worker --timeout=15m
          ingress_ip=""
          for _ in $(seq 1 60); do
            ingress_ip="$(kubectl -n "$ASR_API_NAMESPACE" get ingress asr-api-ingress -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
            if [ -z "$ingress_ip" ]; then
              ingress_ip="$(kubectl -n ingress-nginx get svc ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
            fi
            if [ -n "$ingress_ip" ]; then
              break
            fi
            sleep 5
          done
          test -n "$ingress_ip"
          python3 deploy/linode_api.py upsert-domain-a-record \
            --domain wavey.ai \
            --name asr \
            --target "$ingress_ip" \
            --ttl-sec 30
          kubectl -n "$ASR_API_NAMESPACE" get deploy,pods,svc,ingress
