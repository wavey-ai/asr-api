name: Deploy Asr API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: deploy-asr-api-main
  cancel-in-progress: true

env:
  ASR_API_CLUSTER_LABEL: wavey-us-ord
  ASR_API_NAMESPACE: asr-api
  ASR_API_DOMAIN: asr.wavey.ai
  ASR_API_REGISTRY: ghcr.io
  ASR_API_INGRESS_IMAGE_REPO: ghcr.io/wavey-ai/asr-api-ingress
  ASR_API_WORKER_IMAGE_REPO: ghcr.io/wavey-ai/asr-api-worker
  ASR_API_KUSTOMIZE_PATH: deploy/k8s/asr-api
  ASR_API_MODEL_PVC: asr-api-model
  ASR_API_MODEL_ROOT: /var/lib/asr-api/models
  ASR_API_MODEL_DIR: /var/lib/asr-api/models/parakeet-tdt

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure git auth for private dependencies
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${{ secrets.WAVEY_AI_GH_TOKEN }}@github.com/".insteadOf https://github.com/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate deploy artifacts
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps >/dev/null
          python3 -m py_compile deploy/linode_api.py
          kubectl kustomize "$ASR_API_KUSTOMIZE_PATH" >/dev/null

      - name: Detect image changes
        id: changes
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "wait_image=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before=""
          fi

          if [ -n "$before" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            changed_files="$(git diff --name-only "$before" "$GITHUB_SHA")"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            changed_files="$(git diff --name-only HEAD^ HEAD)"
          else
            changed_files="$(git ls-files)"
          fi

          if [ -z "$changed_files" ]; then
            changed_files="$(git show --pretty='' --name-only "$GITHUB_SHA")"
          fi

          wait_image=false
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              .github/workflows/build-image.yml|.dockerignore|docker/*|docker/**|src/*|src/**|Cargo.toml|Cargo.lock)
                wait_image=true
                ;;
            esac
          done <<<"$changed_files"

          echo "wait_image=$wait_image" >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          printf '  %s\n' $changed_files
          echo "wait_image=$wait_image"

      - name: Wait for image build workflow
        if: steps.changes.outputs.wait_image == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/build-image.yml/runs"
              f"?head_sha={sha}&event=push&per_page=10"
          )
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          deadline = time.time() + 30 * 60
          last_status = None

          while time.time() < deadline:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  payload = json.load(resp)

              runs = payload.get("workflow_runs", [])
              if runs:
                  run = runs[0]
                  status = run.get("status")
                  conclusion = run.get("conclusion")
                  html_url = run.get("html_url")
                  summary = f"build-image.yml run {run.get('id')} status={status} conclusion={conclusion} url={html_url}"
                  if summary != last_status:
                      print(summary)
                      last_status = summary
                  if status == "completed":
                      if conclusion == "success":
                          sys.exit(0)
                      print(f"Image build workflow failed: {html_url}", file=sys.stderr)
                      sys.exit(1)
              else:
                  if last_status != "waiting for build-image.yml run to appear":
                      print("waiting for build-image.yml run to appear")
                      last_status = "waiting for build-image.yml run to appear"

              time.sleep(15)

          print("Timed out waiting for build-image.yml to complete", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Resolve LKE cluster
        id: cluster
        env:
          LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
        run: |
          set -euo pipefail
          python3 deploy/linode_api.py cluster-id \
            --label "$ASR_API_CLUSTER_LABEL" \
            --github-output "$GITHUB_OUTPUT"

      - name: Fetch cluster kubeconfig
        id: kubeconfig
        env:
          LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
        run: |
          set -euo pipefail
          kubeconfig_path="$RUNNER_TEMP/wavey-kubeconfig.yaml"
          python3 deploy/linode_api.py cluster-kubeconfig \
            --cluster-id "${{ steps.cluster.outputs.cluster_id }}" \
            --output "$kubeconfig_path" \
            --github-output "$GITHUB_OUTPUT"

      - name: Deploy asr-api to LKE
        env:
          KUBECONFIG: ${{ steps.kubeconfig.outputs.kubeconfig }}
          LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
          REGISTRY_SERVER: ${{ env.ASR_API_REGISTRY }}
          REGISTRY_USERNAME: jbrough
          REGISTRY_PASSWORD: ${{ secrets.WAVEY_AI_GH_TOKEN }}
          MODEL_TARBALL_URL: ${{ secrets.ASR_API_MODEL_TARBALL_URL }}
        run: |
          set -euo pipefail

          asr_api_ingress_image="${ASR_API_INGRESS_IMAGE_REPO}:main"
          asr_api_worker_image="${ASR_API_WORKER_IMAGE_REPO}:main"
          if [ "${{ steps.changes.outputs.wait_image }}" = "true" ]; then
            short_sha="${GITHUB_SHA::7}"
            asr_api_ingress_image="${ASR_API_INGRESS_IMAGE_REPO}:sha-${short_sha}"
            asr_api_worker_image="${ASR_API_WORKER_IMAGE_REPO}:sha-${short_sha}"
          fi

          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          wait_for_image() {
            local image="$1"
            local attempts="${2:-60}"
            local delay_seconds="${3:-10}"
            for _ in $(seq 1 "$attempts"); do
              if docker manifest inspect "$image" >/dev/null 2>&1; then
                return 0
              fi
              sleep "$delay_seconds"
            done
            echo "Timed out waiting for image $image" >&2
            return 1
          }

          create_loader() {
            local pod_name="$1"
            local node_name="$2"
            local namespace="$3"
            cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${pod_name}
            namespace: ${namespace}
            labels:
              wavey.ai/image-loader: "true"
          spec:
            nodeName: ${node_name}
            restartPolicy: Never
            tolerations:
              - operator: Exists
            containers:
              - name: loader
                image: debian:bookworm-slim
                securityContext:
                  privileged: true
                command:
                  - sh
                  - -lc
                  - |
                    set -eu
                    apt-get update >/dev/null
                    apt-get install -y --no-install-recommends containerd >/dev/null
                    sleep infinity
                volumeMounts:
                  - name: containerd-run
                    mountPath: /run/containerd
            volumes:
              - name: containerd-run
                hostPath:
                  path: /run/containerd
                  type: Directory
          EOF
            kubectl -n "$namespace" wait --for=condition=Ready "pod/${pod_name}" --timeout=180s
          }

          load_image() {
            local image="$1"
            local pod_name="$2"
            local namespace="$3"
            docker pull "$image"
            docker save "$image" | kubectl -n "$namespace" exec -i "$pod_name" -- \
              sh -lc 'cat >/tmp/image.tar && ctr --address /run/containerd/containerd.sock -n k8s.io images import /tmp/image.tar && rm /tmp/image.tar'
          }

          kubectl -n "$ASR_API_NAMESPACE" delete pod -l wavey.ai/image-loader=true --ignore-not-found=true --wait=true || true

          ingress_nodes="$(kubectl get nodes -l 'node.kubernetes.io/instance-type!=g2-gpu-rtx4000a1-s' -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')"
          gpu_nodes="$(kubectl get nodes -l node.kubernetes.io/instance-type=g2-gpu-rtx4000a1-s -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')"

          wait_for_image "$asr_api_ingress_image"
          wait_for_image "$asr_api_worker_image"

          i=0
          while IFS= read -r node; do
            [ -n "$node" ] || continue
            pod_name="asr-api-ingress-loader-${i}"
            create_loader "$pod_name" "$node" "$ASR_API_NAMESPACE"
            load_image "$asr_api_ingress_image" "$pod_name" "$ASR_API_NAMESPACE"
            i=$((i + 1))
          done <<<"$ingress_nodes"

          i=0
          while IFS= read -r node; do
            [ -n "$node" ] || continue
            pod_name="asr-api-worker-loader-${i}"
            create_loader "$pod_name" "$node" "$ASR_API_NAMESPACE"
            load_image "$asr_api_worker_image" "$pod_name" "$ASR_API_NAMESPACE"
            i=$((i + 1))
          done <<<"$gpu_nodes"

          ASR_API_INGRESS_IMAGE="$asr_api_ingress_image" \
          ASR_API_WORKER_IMAGE="$asr_api_worker_image" \
          bash deploy/lke/manual-deploy.sh

          kubectl -n "$ASR_API_NAMESPACE" delete pod -l wavey.ai/image-loader=true --ignore-not-found=true --wait=true || true
