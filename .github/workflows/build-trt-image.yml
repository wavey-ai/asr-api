name: Build Asr API TensorRT Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-trt-image.yml"
      - ".dockerignore"
      - "docker/asr-api-trt.Dockerfile"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-asr-api-trt-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ASR_API_IMAGE: ghcr.io/wavey-ai/asr-api

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ASR_API_IMAGE }}
          tags: |
            type=raw,value=trt-main,enable={{is_default_branch}}
            type=raw,value=trt-latest,enable={{is_default_branch}}
            type=sha,prefix=trt-sha-

      - name: Build and push TensorRT image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/asr-api-trt.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=asr-api-trt
            type=registry,ref=${{ env.ASR_API_IMAGE }}:trt-buildcache
          cache-to: |
            type=gha,scope=asr-api-trt,mode=max
            type=registry,ref=${{ env.ASR_API_IMAGE }}:trt-buildcache,mode=max
          secrets: |
            github_token=${{ secrets.WAVEY_AI_GH_TOKEN }}
