name: Build Asr API Image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-image.yml"
      - ".dockerignore"
      - "docker/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-asr-api-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ASR_API_IMAGE: ghcr.io/wavey-ai/asr-api

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ASR_API_IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/asr-api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=asr-api
            type=registry,ref=${{ env.ASR_API_IMAGE }}:buildcache
          cache-to: |
            type=gha,scope=asr-api,mode=max
            type=registry,ref=${{ env.ASR_API_IMAGE }}:buildcache,mode=max
          secrets: |
            github_token=${{ secrets.WAVEY_AI_GH_TOKEN }}
