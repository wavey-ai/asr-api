name: Build Asr API Image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-image.yml"
      - ".dockerignore"
      - "docker/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-asr-api-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-base-images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: cpu-base
            image: ghcr.io/wavey-ai/asr-api-cpu-base
            dockerfile: docker/asr-api-cpu-base.Dockerfile
            cache_scope: asr-api-cpu-base
            runner: ubuntu-latest
            build_args: ""
          - component: gpu-runtime-base
            image: ghcr.io/wavey-ai/asr-api-gpu-runtime-base
            dockerfile: docker/asr-api-gpu-runtime-base.Dockerfile
            cache_scope: asr-api-gpu-runtime-base
            runner: ubuntu-24.04
            build_args: ""
          - component: gpu-build-base
            image: ghcr.io/wavey-ai/asr-api-gpu-build-base
            dockerfile: docker/asr-api-gpu-build-base.Dockerfile
            cache_scope: asr-api-gpu-build-base
            runner: ubuntu-24.04
            build_args: |
              GPU_RUNTIME_BASE_IMAGE=ghcr.io/wavey-ai/asr-api-gpu-runtime-base:sha-${{ github.sha }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reclaim runner disk
        if: startsWith(matrix.component, 'gpu-')
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push ${{ matrix.component }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: |
            type=gha,scope=${{ matrix.cache_scope }}
            type=registry,ref=${{ matrix.image }}:buildcache
          cache-to: |
            type=gha,scope=${{ matrix.cache_scope }},mode=max
            type=registry,ref=${{ matrix.image }}:buildcache,mode=max
          secrets: |
            github_token=${{ secrets.WAVEY_AI_GH_TOKEN }}

  build-app-images:
    needs: build-base-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: ingress
            image: ghcr.io/wavey-ai/asr-api-ingress
            dockerfile: docker/asr-api-ingress.Dockerfile
            cache_scope: asr-api-ingress
            runner: ubuntu-latest
            build_args: |
              CPU_RUNTIME_BASE_IMAGE=ghcr.io/wavey-ai/asr-api-cpu-base:sha-${{ github.sha }}
          - component: worker
            image: ghcr.io/wavey-ai/asr-api-worker
            dockerfile: docker/asr-api.Dockerfile
            cache_scope: asr-api-worker
            runner: ubuntu-24.04
            build_args: |
              GPU_BUILD_BASE_IMAGE=ghcr.io/wavey-ai/asr-api-gpu-build-base:sha-${{ github.sha }}
              GPU_RUNTIME_BASE_IMAGE=ghcr.io/wavey-ai/asr-api-gpu-runtime-base:sha-${{ github.sha }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reclaim runner disk
        if: matrix.component == 'worker'
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push ${{ matrix.component }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: |
            type=gha,scope=${{ matrix.cache_scope }}
            type=registry,ref=${{ matrix.image }}:buildcache
          cache-to: |
            type=gha,scope=${{ matrix.cache_scope }},mode=max
            type=registry,ref=${{ matrix.image }}:buildcache,mode=max
          secrets: |
            github_token=${{ secrets.WAVEY_AI_GH_TOKEN }}
