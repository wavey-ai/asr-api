name: Build Asr API Image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-image.yml"
      - ".dockerignore"
      - "docker/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-asr-api-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: ingress
            image: ghcr.io/wavey-ai/asr-api-ingress
            dockerfile: docker/asr-api-ingress.Dockerfile
            cache_scope: asr-api-ingress
            local_cache: /var/lib/buildkit-cache/asr-api-ingress
          - component: worker
            image: ghcr.io/wavey-ai/asr-api-worker
            dockerfile: docker/asr-api.Dockerfile
            cache_scope: asr-api-worker
            local_cache: /var/lib/buildkit-cache/asr-api-worker
    runs-on:
      - self-hosted
      - linux
      - x64
      - asr-api-build
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: asr-api-builder
          driver: docker-container
          keep-state: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Prepare local build cache
        run: |
          set -euo pipefail
          mkdir -p "${{ matrix.local_cache }}"
          rm -rf "${{ matrix.local_cache }}-new"

      - name: Build and push ${{ matrix.component }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=local,src=${{ matrix.local_cache }}
            type=registry,ref=${{ matrix.image }}:buildcache
          cache-to: |
            type=local,dest=${{ matrix.local_cache }}-new,mode=max
            type=registry,ref=${{ matrix.image }}:buildcache,mode=max
          secrets: |
            github_token=${{ secrets.WAVEY_AI_GH_TOKEN }}

      - name: Promote local build cache
        if: always()
        run: |
          set -euo pipefail
          if [ -d "${{ matrix.local_cache }}-new" ]; then
            rm -rf "${{ matrix.local_cache }}"
            mv "${{ matrix.local_cache }}-new" "${{ matrix.local_cache }}"
          fi
