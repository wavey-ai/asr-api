apiVersion: v1
kind: ConfigMap
metadata:
  name: asr-api-ingress-config
  namespace: asr-api
data:
  ASR_API_ROLE: ingress
  PORT: "8443"
  ENABLE_H3: "false"
  UPLOAD_RESPONSE_NUM_STREAMS: "256"
  UPLOAD_RESPONSE_SLOT_SIZE_KB: "64"
  UPLOAD_RESPONSE_SLOTS_PER_STREAM: "16384"
  UPLOAD_RESPONSE_TIMEOUT_MS: "300000"
  UPLOAD_RESPONSE_WATCH_POLL_MS: "1"
  RUST_LOG: asr_api=info,web_service=info,upload_response=info
