apiVersion: v1
kind: ConfigMap
metadata:
  name: transcriber-config
  namespace: transcriber
data:
  PORT: "8443"
  ENABLE_H3: "false"
  ASR_MODEL_DIR: /var/lib/transcriber/models/parakeet-tdt
  ASR_DEVICE_IDS: "0"
  ASR_TORCH_SESSIONS: "1"
  ASR_ONNX_SESSIONS: "1"
  CHUNK_SECONDS: "30"
  OVERLAP_SECONDS: "2"
  FINAL_MIN_SECONDS: "0.5"
  UTT_SPLIT_SECONDS: "0.8"
  RUST_LOG: transcriber=info,web_service=info
