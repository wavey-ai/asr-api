apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcriber
  namespace: transcriber
  labels:
    app.kubernetes.io/name: transcriber
    app.kubernetes.io/part-of: transcriber
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: transcriber
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transcriber
        app.kubernetes.io/part-of: transcriber
    spec:
      serviceAccountName: transcriber
      terminationGracePeriodSeconds: 120
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: NotIn
                    values:
                      - g2-gpu-rtx4000a1-s
      initContainers:
        - name: verify-model
          image: busybox:1.36
          command:
            - sh
            - -lc
            - |
              set -eu
              has_any() {
                root="$1"
                shift
                for name in "$@"; do
                  if [ -f "${root}/${name}" ]; then
                    return 0
                  fi
                done
                return 1
              }

              has_any "${ASR_MODEL_DIR}" encoder.fp16.onnx encoder.onnx encoder.int8.onnx
              has_any "${ASR_MODEL_DIR}" decoder.fp16.onnx decoder.onnx decoder.int8.onnx
              has_any "${ASR_MODEL_DIR}" joint.enc.fp16.onnx joint.enc.onnx joint.enc.int8.onnx
              has_any "${ASR_MODEL_DIR}" joint.pred.fp16.onnx joint.pred.onnx joint.pred.int8.onnx
              has_any "${ASR_MODEL_DIR}" joint.joint_net.fp16.onnx joint.joint_net.onnx joint.joint_net.int8.onnx
              if [ ! -f "${ASR_MODEL_DIR}/tokens.txt" ]; then
                test -f "${ASR_MODEL_DIR}/vocab.txt"
              fi
          envFrom:
            - configMapRef:
                name: transcriber-config
            - secretRef:
                name: transcriber-env
                optional: true
          volumeMounts:
            - name: model
              mountPath: /var/lib/transcriber/models
      containers:
        - name: transcriber
          image: ghcr.io/wavey-ai/transcriber:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
          envFrom:
            - configMapRef:
                name: transcriber-config
            - secretRef:
                name: transcriber-env
                optional: true
          env:
            - name: TLS_CERT_PATH
              value: /var/run/transcriber/tls/tls.crt
            - name: TLS_KEY_PATH
              value: /var/run/transcriber/tls/tls.key
          volumeMounts:
            - name: model
              mountPath: /var/lib/transcriber/models
            - name: tls
              mountPath: /var/run/transcriber/tls
              readOnly: true
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 12Gi
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: transcriber-model
        - name: tls
          secret:
            secretName: transcriber-tls
