apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-api-worker
  namespace: asr-api
  labels:
    app.kubernetes.io/name: asr-api-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: asr-api
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: asr-api-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asr-api-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: asr-api
    spec:
      serviceAccountName: asr-api
      imagePullSecrets:
        - name: ghcr-wavey-ai
      terminationGracePeriodSeconds: 120
      tolerations:
        - key: wavey.ai/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values:
                      - g2-gpu-rtx4000a1-s
      initContainers:
        - name: verify-model
          image: busybox:1.36
          command:
            - sh
            - -lc
            - |
              set -eu
              has_any() {
                root="$1"
                shift
                for name in "$@"; do
                  if [ -f "${root}/${name}" ]; then
                    return 0
                  fi
                done
                return 1
              }

              has_any "${ASR_MODEL_DIR}" encoder.fp16.onnx encoder.onnx encoder.int8.onnx
              has_any "${ASR_MODEL_DIR}" decoder.fp16.onnx decoder.onnx decoder.int8.onnx
              has_any "${ASR_MODEL_DIR}" joint.enc.fp16.onnx joint.enc.onnx joint.enc.int8.onnx
              has_any "${ASR_MODEL_DIR}" joint.pred.fp16.onnx joint.pred.onnx joint.pred.int8.onnx
              has_any "${ASR_MODEL_DIR}" joint.joint_net.fp16.onnx joint.joint_net.onnx joint.joint_net.int8.onnx
              if [ ! -f "${ASR_MODEL_DIR}/tokens.txt" ]; then
                test -f "${ASR_MODEL_DIR}/vocab.txt"
              fi
          envFrom:
            - configMapRef:
                name: asr-api-worker-config
            - secretRef:
                name: asr-api-env
                optional: true
          volumeMounts:
            - name: model
              mountPath: /var/lib/asr-api/models
      containers:
        - name: worker
          image: ghcr.io/wavey-ai/asr-api-worker:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
          envFrom:
            - configMapRef:
                name: asr-api-worker-config
            - secretRef:
                name: asr-api-env
                optional: true
          env:
            - name: TLS_CERT_PATH
              value: /var/run/asr-api/tls/tls.crt
            - name: TLS_KEY_PATH
              value: /var/run/asr-api/tls/tls.key
          volumeMounts:
            - name: model
              mountPath: /var/lib/asr-api/models
            - name: tls
              mountPath: /var/run/asr-api/tls
              readOnly: true
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "2"
              memory: 12Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: asr-api-model
        - name: tls
          secret:
            secretName: asr-api-tls
